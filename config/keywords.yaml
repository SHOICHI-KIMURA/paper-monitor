max_results: 200
lookback_days: 7

# ============================================================
# 検索クエリ（PubMedキーワード）
# ------------------------------------------------------------
# 2026-07-06: 「DX・AI × 鼻副鼻腔/嚥下」の2トラックAND方式が
# 直近7日で0件連発（AI語×ドメイン語の同時ヒットは狭すぎた）と判明し、
# 「耳鼻科全域を広く収集し、AI/DX関連は目印を付けて優先表示する」
# 方式に転換。収集条件からAI/DX限定は外した。
#
# domain_terms（OR結合）が収集条件そのもの。対象誌ブロック・掲載日
# レンジと AND 結合される（scripts/fetch_pubmed.py の
# build_pubmed_query() が処理）。
#
# ai_terms は収集条件には使わない。ヒットした論文のタイトル・抄録に
# これらの語が含まれるかだけを見て「AI/DX」チェックボックスを立てる
# ためのタグ付け用リスト（scripts/if_filter.py の tag_ai_dx()）。
# ============================================================

domain_terms:
  - otolaryngology
  - otorhinolaryngology
  - head and neck cancer
  - head and neck neoplasms
  - thyroid cancer
  - salivary gland
  - rhinology
  - chronic rhinosinusitis
  - sinusitis
  - nasal surgery
  - endoscopic sinus surgery
  - allergic rhinitis
  - airway
  - dysphagia
  - swallowing
  - deglutition
  - hearing loss
  - vestibular
  - vertigo
  - microbiome

# AI/DXタグ付け用（収集条件ではない）
ai_terms:
  - artificial intelligence
  - machine learning
  - deep learning
  - digital health
