name: Weekly ENT Paper Digest

on:
  schedule:
    # 07:00 JST every Sunday = 22:00 UTC every Saturday
    - cron: "0 22 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
      DIGEST_BASE_URL: ${{ secrets.DIGEST_BASE_URL }}
      DIGEST_OUTPUT_DIR: outputs/
      TZ: Asia/Tokyo
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        run: python main.py

      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update weekly ENT paper digest"
          git push
